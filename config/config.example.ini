# Example configuration — copy to config.ini locally (gitignored).
# Do NOT put real keys here.

[aws]
region = eu-central-1
access_key_id = YOUR_AWS_ACCESS_KEY_ID_HERE
secret_access_key = YOUR_AWS_SECRET_ACCESS_KEY_HERE
s3_bucket = YOUR_S3_BUCKET_HERE
batch_queue_ondemand = YOUR_ONDEMAND_QUEUE_HERE
batch_queue_spot = YOUR_SPOT_QUEUE_HERE
batch_job_definition = YOUR_JOB_DEFINITION_HERE

[sheets]
google_sheets_id = YOUR_GOOGLE_SHEETS_ID_HERE
google_service_account_json = credentials/google_service_account.json
