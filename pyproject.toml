[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "descriptor-cloud-benchmark"
version = "1.0.0"
description = "Companion code for Performance and Cost Benchmarking of Cloud Resources for Large-Scale Molecular Descriptor Computation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Christos Didachos" },
  { name = "Dimitrios Georgiou" },
  { name = "Manolis Fousteris" },
  { name = "Andreas Kanavos" },
]
keywords = [
  "cheminformatics",
  "molecular-descriptors",
  "aws-batch",
  "cloud-benchmarking",
  "performance",
  "cost",
]
dependencies = [
  "numpy>=1.24,<3.0",
  "pandas>=2.0,<4.0",
  "scikit-learn>=1.3,<2.0",
  "loguru>=0.7,<1.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.0,<15.0",
  "boto3>=1.28,<2.0",
  "gspread>=6.0,<7.0",
  "google-auth>=2.20,<3.0",
  "python-dotenv>=1.0,<2.0",
  "tenacity>=8.2,<10.0",
  "tqdm>=4.66,<5.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "scipy>=1.10"]
dev = ["pytest>=7.0,<10.0"]

[project.urls]
Homepage = "https://github.com/dimigeorgiou/molecular-descriptor-cloud-benchmark"
Repository = "https://github.com/dimigeorgiou/molecular-descriptor-cloud-benchmark"
Issues = "https://github.com/dimigeorgiou/molecular-descriptor-cloud-benchmark/issues"

[project.scripts]
descriptor-cloud-benchmark = "descriptor_cloud_benchmark.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
