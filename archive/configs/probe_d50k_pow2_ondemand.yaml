# D=50k power-of-2 node sweep — low complexity, On-Demand, 1 replica.
name: probe_d50k_pow2_ondemand

mode: compute_only
smiles_complexity: low
descriptor_method: default

dataset_sizes:
  - 50000

node_configs:
  - 2
  - 4
  - 8
  - 16
  - 32

vcpus_per_node: 4
gb_per_node: 8
use_spot: false
n_replicas: 1

dataset_dir: datasets/samples
